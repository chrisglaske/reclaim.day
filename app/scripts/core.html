    pendingSaves += 1;
    saveNotice.failed = false;
    window.clearTimeout(savingTimer);
    savingTimer = window.setTimeout(() => { saveNotice.saving = pendingSaves > 0; }, 400);
    try {
      await upgradeBackup;
      const result = await persistState();
      const time = new Date(result && result.savedAt ? result.savedAt : Date.now())
        .toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      unsavedChanges = false;
      window.clearTimeout(saveRetryTimer);
      saveNotice.queued = false;
      return result;
    } catch (error) {
      if (isStaleSaveError(error)) {
        saveNotice.stale = true;
      } else if (error && error.retryable) {
        console.warn('Reclaim will try saving again:', error);
        unsavedChanges = true;
        saveNotice.queued = navigator.onLine === false ? 'offline' : 'busy';
        window.clearTimeout(saveRetryTimer);
        saveRetryTimer = window.setTimeout(retryUnsaved, SAVE_RETRY_MS);
        return { queued: true };
      } else {
        saveNotice.failed = error && error.reason === 'storageQuotaExceeded' ? 'full' : true;
      }
      throw error;
    } finally {
      pendingSaves -= 1;
      if (!pendingSaves) {
        window.clearTimeout(savingTimer);
        saveNotice.saving = false;
      }
    }
  };

  function retrySave() {
    saveState().catch(error => console.warn('Reclaim could not save on retry:', error));
  }

  // Only when a change is waiting, no save is already running and the file isn't stale (retrying would fail again).
  function retryUnsaved() {
    if (unsavedChanges && !pendingSaves && !saveNotice.stale) retrySave();
  }

  // A change that hasn't reached storage yet, or a save still on its way; used before leaving or signing out.
  function hasUnsavedChanges() {
    return unsavedChanges || pendingSaves > 0;
  }

  // Resolves true once no save is running, or false if one is still going after timeoutMs (waiting for sign-in).
  function savesSettled(timeoutMs = 15000) {
    const until = Date.now() + timeoutMs;
    return new Promise(resolve => {
      const check = () => {
        if (!pendingSaves) resolve(true);
        else if (Date.now() > until) resolve(false);
        else window.setTimeout(check, 200);
      };
      check();
    });
  }

  // start.html asks before the page closes on unsaved changes; sign-out reloads without asking.
  function leavingAllowed() {
    return leaving;
  }

  function allowLeaving() {
    leaving = true;
  }

  function dismissSaveFailed() {
    saveNotice.failed = false;
  }

  // Storage rejects a save when the file changed since this tab last loaded or saved it; matched by its message.
  function isStaleSaveError(error) {
    return String(error && error.message ? error.message : error).includes(STATE_STALE_MESSAGE);
  }

  // After a stale save the newer data loads in place: a page reload would ask to sign in again.
  function forgetUnsavedChanges() {
    unsavedChanges = false;
    window.clearTimeout(saveRetryTimer);
    saveNotice.queued = false;
    saveNotice.stale = false;
  }

  function logicObject(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value);
  }

  // Parses a Date, timestamp or ISO string; a bare YYYY-MM-DD becomes local noon on that day, so time zone
  // and daylight-saving shifts can't move it to a neighboring day. Returns null for anything invalid.
  function logicDate(value) {
    if (value instanceof Date) {
      return Number.isNaN(value.getTime()) ? null : new Date(value.getTime());
    }
    if (typeof value !== 'string' && typeof value !== 'number') return null;
    if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)) {
      const parts = value.split('-').map(Number);
      const date = new Date(parts[0], parts[1] - 1, parts[2], 12);
      return date.getFullYear() === parts[0] &&
        date.getMonth() === parts[1] - 1 &&
        date.getDate() === parts[2] ? date : null;
    }
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function dateKey(value) {
    const date = logicDate(value);
    if (!date) return '';
    return [
      date.getFullYear(),
      String(date.getMonth() + 1).padStart(2, '0'),
      String(date.getDate()).padStart(2, '0')
    ].join('-');
  }

  function dayDate(value) {
    const date = logicDate(value);
    return date ? new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12) : null;
  }

  function dayOffset(value, amount) {
    const date = dayDate(value);
    if (!date) return '';
    date.setDate(date.getDate() + amount);
    return dateKey(date);
  }

  // Whole calendar days from one date to the next (never negative), counted in UTC so a DST change doesn't drop a day.
  function dayDistance(from, to) {
    const start = dayDate(from);
    const end = dayDate(to);
    if (!start || !end) return 0;
    return Math.max(0, Math.floor((Date.UTC(end.getFullYear(), end.getMonth(), end.getDate()) -
      Date.UTC(start.getFullYear(), start.getMonth(), start.getDate())) / LOGIC_DAY_MS));
  }

  function localToday() {
    return dateKey(new Date());
  }

  // Accepts a habit key or its record in S.vices.
  function viceRecord(vice) {
    if (typeof vice === 'string') return S.vices[vice] || null;
    return logicObject(vice) ? vice : null;
  }

  function viceName(vice) {
    if (typeof vice === 'string' && S.vices[vice]) return vice;
    return Object.keys(S.vices).find(key => S.vices[key] === vice) || '';
  }

  function formatQuantity(amount) {
    return new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 })
      .format(Math.max(0, Number(amount) || 0));
  }

  function habitUnitLabel(vice, amount) {
    const unit = viceUnit(vice);
    return Number(amount) === 1 ? unit.one : unit.many;
  }

  function formatCurrency(amount) {
    const currency = STATE_CURRENCIES.includes(S.profile.currency) ? S.profile.currency : 'USD';
    return new Intl.NumberFormat(undefined, { style: 'currency', currency: currency })
      .format(Math.max(0, Number(amount) || 0));
  }

  // Saves for doses and daily intentions: alerts when a save fails outright, then rethrows so the caller can react.
  // A stale save skips the alert (the save notice covers it), and a queued (offline) save counts as success.
  async function persistLogicState() {
    try {
      return await saveState();
    } catch (error) {
      console.error('Could not save Reclaim data:', error);
      if (!isStaleSaveError(error) && typeof window !== 'undefined' && typeof window.alert === 'function') {
        window.alert('Your changes could not be saved. Please try again before leaving this page.');
      }
      throw error;
    }
  }
</script>
