<script>
  // The check-in, ported from the design mockup (its flowOpen … flowClose and the f* act() cases).
  // V.flow is the mockup's S.flow; v holds the answers with mood 0–4 (MOODS index) or null.
  // Saving keeps the app's rules: createdAt is the first save; only the mood reaches the day, and only
  // from the latest time of day with a mood (moodFrom names it); sleep and craving stay on the check-in.
/* a past day's single check-in (sl 'daily') has the same steps without the sleep or cravings one */
const FKEYS=sl=>sl==='daily'?['mood','body','words','review']:['mood','detail','body','words','review'];
const FLABEL={mood:'Mood',body:'Your body',words:'A few words',review:'Review'};
const FSTEPS=sl=>FKEYS(sl).map(k=>k==='detail'?(sl==='morning'?'Sleep & focus':'Cravings & context'):FLABEL[k]);
const fRev=sl=>FKEYS(sl).length-1,fDone=sl=>FKEYS(sl).length;
const CRW=n=>n==null?'Not rated':n===0?'None':n<=3?'Mild':n<=6?'Moderate':n<=8?'Strong':'Very strong';
const fh=h=>h==null?'–':String(+h.toFixed(2));
const CTX=JOURNAL_TAGS,SQ=SLEEP_WORDS,PROMPTS=CHECKIN_PROMPTS;
const nextSlot=()=>['morning','afternoon','evening'].find(s=>!ckDay(localToday())[s])||'evening';
const slotL=sl=>sl==='daily'?'Day':SLOTS.find(s=>s[0]===sl)[3];

  // A saved check-in's answers in the flow's shape.
  function checkinAnswers(saved) {
    return {
      mood: Number.isInteger(saved.mood) && saved.mood >= 1 && saved.mood <= 5 ? saved.mood - 1 : null,
      sleep: saved.sleepHours !== null && saved.sleepHours !== '' && Number.isFinite(Number(saved.sleepHours)) ? Number(saved.sleepHours) : null,
      q: Number.isInteger(saved.sleepQuality) && saved.sleepQuality > 0 ? saved.sleepQuality : null,
      focus: typeof saved.intention === 'string' ? saved.intention : '',
      craving: Number.isInteger(saved.craving) ? saved.craving : null,
      tags: Array.isArray(saved.tags) ? saved.tags.filter(tag => JOURNAL_TAGS.includes(tag)) : [],
      health: Array.isArray(saved.health) ? saved.health.filter(tag => HEALTH_TAGS.includes(tag)) : [],
      healthOther: typeof saved.healthOther === 'string' ? saved.healthOther : '',
      text: typeof saved.text === 'string' ? saved.text : ''
    };
  }

function flowOpen(sl,day,review){
  const dc=sl==='daily'&&dayCheck(day),c=dc?checkinAnswers(dc):ckDay(day)[sl],td=localToday();
  const past=day<td||(day===td&&SLOTS.findIndex(s=>s[0]===sl)<SLOTS.findIndex(s=>s[0]===curSlot())); // an earlier time of day asks in the past tense, without today's mood
  V.flow={sl,day,step:review&&c?fRev(sl):0,dir:'r',edit:!!c,past,pre:!c&&!past&&day===td&&amood()!=null,v:c?JSON.parse(JSON.stringify(c)):{mood:day===td&&!past?amood():null,sleep:null,q:null,focus:'',craving:null,tags:[],health:[],healthOther:'',text:''}};
  V.flow.v.tags??=[];V.flow.v.health??=[];V.flow.v.healthOther??='';V.flow.v.text??='';
  if(!$('#flow.open'))V.flowFrom=document.activeElement;
  closeSheet();if(typeof closeQ==='function')closeQ();renderFlow();const f=$('#flow');f.classList.add('open');f.tabIndex=-1;f.focus({preventScroll:true});
}
function fAnswered(){const f=V.flow,v=f.v;return {mood:v.mood!=null,detail:f.sl==='morning'?(v.sleep!=null||!!v.q||!!v.focus):(v.craving!=null||v.tags.length>0),body:v.health.length>0,words:!!v.text.trim(),review:true}[FKEYS(f.sl)[f.step]];}
const fNextLabel=()=>V.flow.step===fRev(V.flow.sl)?(V.flow.edit?'Save changes':'Save check-in'):fAnswered()?'Continue':'Skip this step';
const fLabel=()=>{const n=$('#fnext');if(n)n.textContent=fNextLabel();};
function flowStep(){
  const f=V.flow,v=f.v,mor=f.sl==='morning',opt='<span class="muted" style="font-weight:500">· optional</span>';
  const at=k=>FKEYS(f.sl).indexOf(k);
  switch(FKEYS(f.sl)[f.step]||'done'){
    case 'mood':return `<div class="flq">${f.pre&&v.mood===amood()?`<h2>Earlier you said “${MOODS[v.mood][1].toLowerCase()}”. Still feel that way?</h2><p>Continue to keep it, or tap the one that fits now.</p>`:f.past?`<h2>${f.sl==='daily'?'How was this day?':`How did you feel in the ${slotL(f.sl).toLowerCase()}?`}</h2>`:`<h2>How are you feeling right now?</h2><p>There’s no wrong answer. Tap the one that fits best.</p>`}</div>
      <div class="bigmoods ${v.mood!=null?'picked':''}" role="radiogroup" aria-label="Mood">${MOODS.map(([e,l],i)=>`<button class="bm ${v.mood===i?'on':''}" role="radio" aria-checked="${v.mood===i}" data-act="fmood:${i}"><span>${e}</span><b class="bml">${l}</b></button>`).join('')}</div>`;
    case 'detail':return mor?`<div class="flq"><h2>How did you sleep?</h2><p>A rough guess is plenty.</p></div>
      <div class="fcard"><div class="bstep"><button data-act="fsl:-" aria-label="A quarter hour less">−</button><span class="bigval" id="fslv">${fh(v.sleep)}<small>h</small></span><button data-act="fsl:+" aria-label="A quarter hour more">+</button></div>
        <div class="chips" id="fslc">${[5,6,7,8,9].map(h=>`<button class="chip ${v.sleep===h?'on':''}" data-act="fslset:${h}">${h} hours</button>`).join('')}</div></div>
      <div><span class="lbl">And how did it feel? ${opt}</span><div class="chips" id="fsq">${SQ.map((l,i)=>`<button class="chip ${v.q===i+1?'on':''}" data-act="fq:${i+1}">${ck()}${l}</button>`).join('')}</div></div>
      <div><label class="lbl" for="ffocus">One small focus for today? ${opt}</label><input class="field" id="ffocus" maxlength="200" placeholder="e.g. Walk at lunch" value="${esc(v.focus||'')}"></div>`
    :`<div class="flq"><h2>${f.past?`How strong were cravings in the ${slotL(f.sl).toLowerCase()}?`:'How strong are cravings right now?'}</h2><p>Just a number. It isn’t a test.</p></div>
      <div class="fcard"><span class="bigval" id="fcrv">${v.craving??'–'}</span><div class="cword" id="fcrw">${CRW(v.craving)}</div>
        <input type="range" class="bigrng" id="fcr" min="0" max="10" value="${v.craving??0}" aria-label="Craving strength, 0 to 10"><div class="scale"><span>0 · None</span><span>10 · Very strong</span></div>
        <button class="link" data-act="fcrskip">Leave unrated</button></div>
      <div><span class="lbl">What’s been around you? <span class="muted" style="font-weight:500">· pick any</span></span><div class="chips">${CTX.map(t=>`<button class="chip ${v.tags.includes(t)?'on':''}" data-act="ftag" data-v="${t}">${ck()}${t}</button>`).join('')}</div></div>`;
    case 'body':return `<div class="flq"><h2>${f.sl==='daily'?'How did your body feel?':f.past?`How did your body feel in the ${slotL(f.sl).toLowerCase()}?`:'How’s your body feeling?'}</h2><p>Pick any, or skip.</p></div>
      <div class="chips">${HEALTH_TAGS.map(t=>`<button class="chip ${v.health.includes(t)?'on':''}" data-act="fhealth" data-v="${t}" aria-pressed="${v.health.includes(t)}">${ck()}${t}</button>`).join('')}</div>
      <div id="fhow" ${v.health.includes('Other')?'':'hidden'}><label class="lbl" for="fhother">What’s going on? <span class="muted" style="font-weight:500">· optional</span></label><input class="field" id="fhother" maxlength="200" placeholder="e.g. Sore throat" value="${esc(v.healthOther||'')}"></div>`;
    case 'words':return `<div class="flq"><h2>A few words, if you like</h2><p>Or none at all. A prompt can help you start.</p></div>
      <div class="chips">${PROMPTS.map((p,i)=>`<button class="chip" data-act="fprompt:${i}">${p}</button>`).join('')}</div>
      <div><textarea id="ftext" maxlength="5000" placeholder="Whatever is on your mind…" aria-label="Your note">${esc(v.text)}</textarea><div class="tcount" id="ftc">${v.text.length} / 5000</div></div>`;
    case 'review':{const rows=[[0,'smile','mint','Mood',v.mood!=null?MOODS[v.mood][0]+' '+MOODS[v.mood][1]:'Not noted']];
      if(mor)rows.push([1,'moon','lilac','Sleep & focus',[v.sleep!=null?fh(v.sleep)+' hours':'',v.q?SQ[v.q-1]:'',v.focus?'Focus: '+esc(v.focus):''].filter(Boolean).join(' · ')||'Not noted']);
      else if(f.sl!=='daily')rows.push([1,'wave','peach','Cravings & context',[v.craving!=null?`Craving ${v.craving}/10`:'Craving not rated',...v.tags].join(' · ')]);
      rows.push([at('body'),'leaf','sky','Your body',healthWords(v).map(esc).join(' · ')||'Nothing noted']);
      const t=v.text.trim();rows.push([at('words'),'pen','butter','Your words',t?esc(t.slice(0,160))+(t.length>160?'…':''):'No note this time']);
      return `<div class="flq"><h2>Your check-in</h2><p>Have a look. Tap Edit to change anything.</p></div>
      <section class="card rvlist">${rows.map(([s,i,c,k,val])=>`<div class="rv"><span class="itile ${c}">${I(i)}</span><div><div class="k">${k}</div><div class="muted">${val}</div></div><button class="link" data-act="fgo:${s}">Edit</button></div>`).join('')}</section>`;}
    case 'done':{const n=Object.keys(ckDay(f.day)).length,nm=S.profile.name.trim();
      return `<div class="donec">${CHECK}</div><h2>${f.edit?'Changes saved':'Check-in saved'}</h2><p>Thanks for pausing${nm?', '+esc(nm):''}. ${f.day===localToday()?`That’s ${n} of 3 check-ins today.`:'That day is up to date.'}</p><button class="btn primary lg" data-act="fclose" style="min-width:220px;margin-top:8px">Done</button>`;}
  }
}
function renderFlow(){
  const f=V.flow,st=FSTEPS(f.sl),done=f.step===fDone(f.sl);
  $('#flow').innerHTML=`<div class="glow"><i></i><i></i><i></i></div>
    <div class="fltop"><button class="iconbtn" data-act="fclose" aria-label="Close check-in">${I('x')}</button>
      <div class="flmid"><div class="eyebrow">${slotL(f.sl)} check-in · ${f.day===localToday()?'Today':dlab(f.day,{weekday:'short',month:'short',day:'numeric'})}</div>${done?'':`<div class="fldots" role="img" aria-label="Step ${f.step+1} of ${st.length}: ${st[f.step]}">${st.map((_,i)=>`<i class="${i<f.step?'done':i===f.step?'cur':''}"></i>`).join('')}</div>`}</div><span style="width:44px"></span></div>
    <div class="flbody"><div class="flcol ${done?'fldone':''} in-${f.dir}">${flowStep()}</div></div>
    ${done?'':`<div class="flfoot"><div class="inner">${f.step?`<button class="btn lg" data-act="fback">Back</button>`:''}<button class="btn primary lg" id="fnext" data-act="fnext">${fNextLabel()}</button></div></div>`}`;
  if(done)setTimeout(()=>sparks($('#flow .donec'),20),250);
}
function fGo(n){const f=V.flow;f.dir=n>=f.step?'r':'l';f.step=n;if(n===fRev(f.sl))f.ret=false;renderFlow();}
function fNext(){const f=V.flow;if(f.step===fRev(f.sl))return fSave();fGo(f.ret?fRev(f.sl):f.step+1);}

  function validateCheckin(slot, v) {
    const errors = [];
    if (v.mood !== null && (!Number.isInteger(v.mood) || v.mood < 0 || v.mood > 4)) errors.push('Choose a mood.');
    if (v.craving !== null && (!Number.isInteger(v.craving) || v.craving < 0 || v.craving > 10)) errors.push('Choose a craving rating from 0 to 10.');
    if (slot === 'morning') {
      const sleep = validateSleepHours(v.sleep);
      if (!sleep.valid) errors.push(sleep.error);
      if (v.q !== null && (!Number.isInteger(v.q) || v.q < 1 || v.q > 5)) errors.push('Choose a sleep quality from 1 to 5.');
      if ((v.focus || '').length > 200) errors.push('Keep the focus to 200 characters or fewer.');
    }
    if (v.text.length > 5000) errors.push('Keep the note to 5,000 characters or fewer.');
    return errors;
  }

  // The mockup's fSave on the saved data.
  function fSave() {
    const f = V.flow, v = f.v, slot = f.sl, key = f.day;
    const errors = validateCheckin(slot, v);
    if (slot === 'daily' && v.mood == null && !v.health.length && !v.text.trim()) errors.push('Pick a mood or add a few words first');
    if (errors.length) { toast(errors[0]); return; }
    const before = S.journal[key] ? JSON.parse(JSON.stringify(S.journal[key])) : null;
    const entry = journalRecord(key) || { mood: 0, craving: null, text: '', sleepHours: null, sleepQuality: 0, intention: '', tags: [], updatedAt: '', checkins: {} };
    if (!logicObject(entry.checkins)) entry.checkins = {};
    const previous = entry.checkins[slot], at = new Date().toISOString();
    const checkin = { mood: v.mood != null ? v.mood + 1 : 0, text: v.text.trim().slice(0, 5000), createdAt: previous && (previous.createdAt || previous.updatedAt) || at, updatedAt: at };
    if (slot === 'morning') Object.assign(checkin, { sleepHours: validateSleepHours(v.sleep).value, sleepQuality: v.q || 0, intention: (v.focus || '').trim().slice(0, 200) });
    else if (slot !== 'daily') Object.assign(checkin, { craving: v.craving, tags: v.tags.slice() });
    if (v.health.length) checkin.health = v.health.slice();
    if (v.health.includes('Other') && v.healthOther.trim()) checkin.healthOther = v.healthOther.trim().slice(0, 200);
    entry.checkins[slot] = checkin;
    const later = CHECKIN_SLOTS.slice(CHECKIN_SLOTS.indexOf(slot) + 1).some(other => entry.checkins[other] && Number(entry.checkins[other].mood) > 0);
    if (checkin.mood && !later) { entry.mood = checkin.mood; entry.moodFrom = slot; }
    else if (slot === 'daily' && !later && entry.moodFrom === 'daily') { entry.mood = 0; delete entry.moodFrom; }
    entry.updatedAt = at;
    S.journal[key] = entry;
    fGo(fDone(slot));
    saveInBackground(() => {
      if (before) S.journal[key] = before; else delete S.journal[key];
      if (V.view === 'today' && $('#tgrid')) { refreshHero(); swap('dmood', dMood()); }
    });
  }

function flowClose(){
  const f=V.flow;$('#flow')?.classList.remove('open');if(!f)return;V.flow=null;
  if(f.step===fDone(f.sl)){if(V.view==='journal'&&typeof renderJ==='function')renderJ();if(V.view==='today'){refreshHero();V.amfresh=!!amsrc();swap('dmood',dMood());V.amfresh=false;}toast(`${slotL(f.sl)} check-in ${f.edit?'updated':'saved'}`);}
  /* focus goes back to where the check-in was opened from */
  const from=V.flowFrom;V.flowFrom=null;if(from?.isConnected)from.focus({preventScroll:true});else $('#main')?.focus({preventScroll:true});
}

Object.assign(ACT,{
  flow:(b,e,x,y,a='flow')=>flowOpen(x==='now'?(ckDay(localToday())[curSlot()]?nextSlot():curSlot()):x,x!=='now'&&V.view==='journal'&&V.jday?V.jday:localToday(),a==='flowrev'),
  flowrev:(b,e,x)=>ACT.flow(b,e,x,null,'flowrev'),
  fmood:(b,e,x)=>{V.flow.v.mood=+x;const g=b.parentNode;$$('.bm',g).forEach(m=>{m.classList.toggle('on',m===b);m.setAttribute('aria-checked',m===b);});g.classList.add('picked');fLabel();},
  /* picking a mood no longer moves on by itself (user, 2026-10-24: people tapped again on the next page and skipped sleep); Continue does */
  fsl:(b,e,x,y,a='fsl')=>{const v=V.flow.v;v.sleep=a==='fslset'?+x:Math.max(0,Math.min(24,v.sleep==null?7:v.sleep+(x==='+'?.25:-.25)));
    const el=$('#fslv');el.innerHTML=fh(v.sleep)+'<small>h</small>';bump(el);$$('#fslc .chip').forEach(c=>c.classList.toggle('on',+c.dataset.act.split(':')[1]===v.sleep));fLabel();},
  fslset:(b,e,x)=>ACT.fsl(b,e,x,null,'fslset'),
  fq:(b,e,x)=>{const v=V.flow.v;v.q=v.q===+x?null:+x;$$('#fsq .chip').forEach(c=>c.classList.toggle('on',c===b&&v.q!=null));fLabel();},
  ftag:b=>{const t=V.flow.v.tags,i=t.indexOf(b.dataset.v);i<0?t.push(b.dataset.v):t.splice(i,1);b.classList.toggle('on',i<0);fLabel();},
  fhealth:b=>{const t=V.flow.v.health,i=t.indexOf(b.dataset.v);i<0?t.push(b.dataset.v):t.splice(i,1);b.classList.toggle('on',i<0);b.setAttribute('aria-pressed',i<0);fLabel();if(b.dataset.v==='Other'){$('#fhow').hidden=i>=0;if(i<0)$('#fhother').focus({preventScroll:true});}},
  fcrskip:()=>{V.flow.v.craving=null;$('#fcr').value=0;$('#fcrv').textContent='–';$('#fcrw').textContent=CRW(null);fLabel();},
  fprompt:(b,e,x)=>{const ta=$('#ftext');ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+PROMPTS[x]+' ';V.flow.v.text=ta.value;$('#ftc').textContent=ta.value.length+' / 5000';ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);fLabel();},
  fnext:()=>fNext(),
  fback:()=>{V.flow.ret=false;fGo(V.flow.step-1);},
  fgo:(b,e,x)=>{V.flow.ret=true;fGo(+x);},
  fclose:()=>flowClose()
});
app.addEventListener('input',e=>{const t=e.target,v=V.flow?.v;if(!v)return;if(t.id==='fhother')v.healthOther=t.value;
  if(t.id==='fcr'){v.craving=+t.value;$('#fcrv').textContent=t.value;$('#fcrw').textContent=CRW(v.craving);fLabel();}
  if(t.id==='ffocus'){v.focus=t.value;fLabel();}
  if(t.id==='ftext'){v.text=t.value;$('#ftc').textContent=t.value.length+' / 5000';fLabel();}});
app.addEventListener('keydown',e=>{const fo=$('#flow.open');if(!fo||$('#sheet.open'))return;
  if(e.key==='Escape'){flowClose();return;}
  if(e.key==='Enter'&&e.target.id==='ffocus'){e.preventDefault();fNext();return;}
  /* focus stays inside the check-in while it is open */
  if(e.key==='Tab'){const f=$$('button,input,textarea,[href]',fo).filter(x=>!x.disabled&&x.offsetParent),a=f[0],z=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===a||document.activeElement===fo)){e.preventDefault();z?.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a?.focus();}}});
</script>
