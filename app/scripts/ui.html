const I=(n,cls='')=>!P[n]?`<svg class="ic emo ${cls}" viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="13" text-anchor="middle" dominant-baseline="central" font-size="25">${n}</text></svg>`:`<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const MOODS=[['😣','Struggling'],['🙁','Heavy'],['😐','Getting by'],['🙂','Doing okay'],['😄','Going well']];
const V={screen:'today',device:innerWidth<860?'phone':'desktop',view:'today',tmin:{},hmin:{},sall:false,snew:false,amedit:false,flow:null,sset:'profile',jq:'',jswap:false};
const app=$('#app');
const now=()=>new Date().toLocaleTimeString(dateLocale(), clockOptions());
const blur=v=>hide()?'••':v;
const dk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pd=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const addD=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return dk(d);};
const dlab=(k,o={weekday:'long',month:'long',day:'numeric'})=>pd(k).toLocaleDateString(dateLocale(), o);
const mins=t=>{const m=String(t).match(/(\d+):(\d+)\s*(AM|PM)?/i);if(!m)return 0;let h=+m[1];if(m[3]){h%=12;if(/pm/i.test(m[3]))h+=12;}return h*60+ +m[2];};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hi=(t,q)=>{const e=esc(t);if(!q)return e;return e.replace(new RegExp('('+esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');};
const dBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const ck=()=>`<span class="ck">${I('check')}</span>`;
const SLOTS=[['morning','sun','butter','Morning'],['afternoon','sun','sky','Afternoon'],['evening','moon','lilac','Evening']];
const sum=a=>a.reduce((x,y)=>x+y,0);
const sdate=k=>dlab(k,{month:'short',day:'numeric'});
const seg=(name,opts,val)=>`<div class="seg" data-seg="${name}"><span class="sp"></span>${opts.map(([v,l])=>`<button class="${v===val?'on':''}" data-act="seg:${name}:${v}">${l}</button>`).join('')}</div>`;
function placeSeg(){$$('.seg',app).forEach(s=>{const on=$('button.on',s),p=$('.sp',s);if(on&&s.offsetParent){p.style.left=on.offsetLeft+'px';p.style.width=on.offsetWidth+'px';}});}
function swap(id,html){const el=$('#'+id);if(!el)return;const y=$('#main').scrollTop;el.outerHTML=html;$('#main').scrollTop=y;}

/* ---------- shell ---------- */
const NAV=[['today','sun','Today'],['tracking','leaf','Tracking'],['journal','book','Journal'],['insights','chart','Insights'],['appts','cal','Appointments','Visits'],['settings','sliders','Settings']];
const nvBtn=([k,i,l,sh],short)=>`<button class="nv ${V.view===k?'on':''}" data-act="nav:${k}" ${short&&sh?`aria-label="${l}"`:''}>${I(i)}${short&&sh||l}</button>`;
function shell(){
  return `<a class="skip-link" href="#main">Skip to main content</a><div class="shell">
    <aside class="side"><div class="logo"><span class="mark">${I('leaf')}</span>reclaim</div>
      <button class="btn primary qlog" data-act="qpop" aria-haspopup="menu" aria-expanded="false" aria-controls="qpop">${I('plus')}Quick log<span class="kbd" aria-hidden="true">N</span></button>
      <nav><span class="navpill"></span>${NAV.map(nvBtn).join('')}</nav>
      <div class="sfoot"><div class="supcard"><b>Need support?</b><span class="muted">Breathing, coping tools and people to reach.</span><button class="btn sm" data-act="sos">${I('life')}Open support</button></div>
      <div class="srow"><span><span class="dot"></span>All changes saved</span><button class="iconbtn ${hide()?'on':''}" data-act="hide" title="Hide counters" aria-pressed="${hide()}">${I(hide()?'eyeoff':'eye')}</button></div></div></aside>
    <header class="mtop"><div class="logo"><span class="mark">${I('leaf')}</span>reclaim</div>
      <button class="iconbtn ${hide()?'on':''}" data-act="hide" aria-label="Hide counters" aria-pressed="${hide()}">${I(hide()?'eyeoff':'eye')}</button>
      <button class="iconbtn lifebtn" data-act="sos" aria-label="Need support">${I('life')}</button>
      <button class="avatar" data-act="nav:settings" aria-label="Settings">${esc(initial())}</button></header>
    <main id="main" tabindex="-1"><div class="wrap enter" id="view"></div></main>
    <nav class="tabbar"><span class="navpill"></span>${nvBtn(NAV[0])}${nvBtn(NAV[1])}${nvBtn(NAV[2])}${nvBtn(NAV[3])}${nvBtn(NAV[4],1)}<button class="plus" data-act="quick" aria-label="Quick log">${I('plus')}</button></nav>
  </div>
  <div class="sheetw" id="sheet"><div class="scrim" data-act="sclose"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Dialog"><div class="shead"><span class="grab"></span><button class="sx" data-act="sclose" aria-label="Close without saving" title="Close">${I('x')}</button></div><div id="sheetc"></div></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"><span id="tmsg"></span><button id="tundo" data-act="undo">Undo</button></div>
  <div class="toast savenote" id="savenote" role="status" aria-live="polite"></div>
  <div class="tip" id="tip" role="tooltip"></div>
  <div class="qpop" id="qpop" role="menu" aria-label="Quick log"></div>
  <div class="sos" id="sos" role="dialog" aria-modal="true" aria-label="Support"></div>
  <div class="flow" id="flow" role="dialog" aria-modal="true" aria-label="Check-in"></div>`;
}

/* Screens not yet connected to the real data show one card, never the mockup's made-up data. */
const pendingView=()=>`<section class="card"><div class="ctitle"><h2>This screen is being connected.</h2></div></section>`;
const VIEWS={today:pendingView,tracking:pendingView,journal:pendingView,insights:pendingView,settings:pendingView};
function renderView(){
  const v=$('#view');v.innerHTML=VIEWS[V.view]();if(V.view==='insights')animInsights();
  v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');$('#main').scrollTop=0;
  requestAnimationFrame(()=>{placePills();jSpy();placeSeg();});
}
/* re-render in place for the counters toggle: keep scroll, skip the page entrance, and fade in only what changed */
function swapView(){
  const v=$('#view'),m=$('#main'),top=m.scrollTop,old=v.cloneNode(true);
  v.innerHTML=VIEWS[V.view]();
  const own=e=>[...e.childNodes].filter(c=>c.nodeType===3).map(c=>c.textContent).join('');
  const diff=(o,n)=>{if(o.outerHTML===n.outerHTML)return;
    if(o.tagName!==n.tagName||o.children.length!==n.children.length||o.className!==n.className||own(o)!==own(n)){n.classList.add('swapin');return;}
    const before=$$('.swapin',n).length;[...n.children].forEach((c,i)=>diff(o.children[i],c));
    if($$('.swapin',n).length===before)n.classList.add('swapin');};
  if(old.children.length===v.children.length)[...v.children].forEach((c,i)=>diff(old.children[i],c));else v.classList.add('swapin');
  v.getAnimations({subtree:true}).forEach(an=>{const t=an.effect?.target;if(t&&!t.closest('.swapin')&&isFinite(an.effect.getComputedTiming().endTime))an.finish();});
  if(V.view==='insights')$$('.ring .rv,.mtrack .dot',v).forEach(e=>{e.style.transition='none';if(e.dataset.off)e.style.strokeDashoffset=e.dataset.off;if(e.dataset.left)e.style.left=e.dataset.left;void e.offsetWidth;e.style.transition='';});
  m.scrollTo({top,behavior:'instant'});requestAnimationFrame(placePills);
}
function placePills(){$$('.side nav,.tabbar',app).forEach(n=>{const on=$('.nv.on',n),p=$('.navpill',n);if(!n.offsetParent)return;if(!on){p.style.opacity=0;return;}p.style.opacity=1;Object.assign(p.style,{left:on.offsetLeft+'px',top:on.offsetTop+'px',width:on.offsetWidth+'px',height:on.offsetHeight+'px'});});}
new ResizeObserver(()=>{placePills();}).observe(app);

/* The theme comes from the startup script; the mockup sets it on .app. */
/* Zine looks also get the site's details (.zine in app.html). */
const ZINE_LOOKS=['zine'];
function applyAppTheme(){const t=document.documentElement.dataset.theme||'pine';app.className='app '+V.device+(window.reclaimStartup.isDark(t)?' dark':'')+(ZINE_LOOKS.includes(t)?' zine':'');app.dataset.theme=t;}
function renderAll(){
  applyAppTheme();
  if(V.screen==='onboard'){renderOb();return;}
  app.innerHTML=shell();renderView();renderSaveNotice();
}
addEventListener('resize',()=>{const d=innerWidth<860?'phone':'desktop';if(d!==V.device){V.device=d;applyAppTheme();requestAnimationFrame(placePills);}});

function openSheet(html){const c=$('#sheetc'),was=$('#sheet').classList.contains('open');if(!was)V.sheetFrom=document.activeElement;c.innerHTML=html;const hd=c.querySelector('h2,h3'),sl=$('#sheet .sheet');if(hd){hd.id='sheett';sl.setAttribute('aria-labelledby','sheett');}else sl.removeAttribute('aria-labelledby');if(was){c.classList.remove('swapc');void c.offsetWidth;c.classList.add('swapc');}$('#sheetc').scrollTop=0;$('#sheet').classList.add('open');if(!was){const sh=$('#sheet .sheet');sh.tabIndex=-1;sh.focus({preventScroll:true});}}
/* the X, Cancel, Escape and the backdrop: a sheet opened from another one (V.sheetBack) goes back to it */
function dismissSheet(){const back=V.sheetBack;V.sheetBack=null;if(back)back();else closeSheet();}
function closeSheet(){V.sheetBack=null;const was=$('#sheet.open');$('#sheet')?.classList.remove('open');$('.plus',app)?.classList.remove('open');
  /* focus goes back to where the sheet was opened from */
  if(!was)return;if(window.reclaimLatestWaiting)setTimeout(()=>loadLatest(true),250);const from=V.sheetFrom;V.sheetFrom=null;if(from?.isConnected&&from!==document.body&&from.getClientRects().length)from.focus({preventScroll:true});else($('#flow.open')||$('#sos.open')||$('#main'))?.focus({preventScroll:true});}

/* ---------- actions ---------- */
/* One handler per data-act verb; each screen's file adds its own with Object.assign(ACT, {...}). */
const ACT={
  nav:(b,e,x)=>{if(x==='appts'){asGo();return;}closeSheet();if(V.view===x)return;V.view=x;$$('.nv',app).forEach(n=>n.classList.toggle('on',n.dataset.act==='nav:'+x));renderView();},
  sclose:()=>dismissSheet(),
  undo:()=>{undoFn?.();undoFn=null;$('#toast').classList.remove('show');},
  toast:(b,e,x)=>toast(x),
  tag:b=>b.classList.toggle('on'),
  one:b=>{const g=b.parentNode;$$('.chip',g).forEach(c=>c.classList.toggle('on',c===b));},
  seg:(b,e,x,y)=>{if(x==='mwhen')$('#mwhent').hidden=y!=='earlier';if(x==='sosm'){$('#sbox').hidden=y!=='box';$('#spause').hidden=y!=='pause';}if(x==='mkind'){$('#mk-sched').hidden=y!=='sched';$('#mk-prn').hidden=y!=='prn';}$$(`[data-seg="${x}"] button`,app).forEach(s=>s.classList.toggle('on',s===b));placeSeg();if(x==='mwhen'&&typeof mguide==='function')mguide();},
  hide:b=>{const was=hide();setHide(!was);$$('.iconbtn[data-act="hide"]',app).forEach(h=>{h.classList.toggle('on',hide());h.setAttribute('aria-pressed',hide());h.innerHTML=I(hide()?'eyeoff':'eye');});if(V.view==='settings'){b.setAttribute('aria-checked',hide());flashSaved(b);}else swapView();toast(hide()?'Counters hidden':'Counters shown');
    saveInBackground(()=>{setHide(was);renderAll();});}
};
function act(b,e){const [a,x,y]=b.dataset.act.split(':');ACT[a]?.(b,e,x,y);}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  if(b.matches('.btn,.qbtn,.chip,.tile,.sw,.lrow'))ripple(b,e);
  act(b,e);
});
function showTip(el){const t=$('#tip');if(!t)return;t.innerHTML=el.dataset.tip;const a=app.getBoundingClientRect(),r=el.getBoundingClientRect();
  let x=r.left+r.width/2-a.left;const w=t.offsetWidth/2+8;x=Math.max(w,Math.min(a.width-w,x));t.style.left=x+'px';t.style.top=r.top-a.top+'px';t.classList.add('show');}
const hideTip=()=>$('#tip')?.classList.remove('show');
app.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');el?showTip(el):hideTip();});
app.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');el?showTip(el):hideTip();});
app.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#sheet.open')){dismissSheet();e.stopImmediatePropagation();}else if($('#sos.open'))closeSos();closeQ();return;}
  /* focus stays inside an open sheet */
  const sh=$('#sheet.open .sheet');if(sh&&e.key==='Tab'){const f=$$('button,input,select,textarea,[href]',sh).filter(x=>!x.disabled&&x.offsetParent),a=f[0],z=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===a||document.activeElement===sh)){e.preventDefault();z?.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a?.focus();}}});
</script>
