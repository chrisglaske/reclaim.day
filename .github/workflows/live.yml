# Builds the app from this repository and checks that app.reclaim.day serves exactly those files,
# on pushes to main that change the app or its build, once a day, and on request. It only reads public URLs, so it needs no secrets.
name: live app matches this code

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/build-app.mjs'
      - 'tools/lib/**'
      - 'tools/verify-live.mjs'
      - '.github/workflows/live.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Build the app
        run: node tools/build-app.mjs
      # A deploy follows the push by hand, so a push gets 20 minutes to go live; other runs check once.
      - name: Compare with app.reclaim.day
        run: |
          tries=1
          if [ "$GITHUB_EVENT_NAME" = push ]; then tries=40; fi
          for try in $(seq 1 "$tries"); do
            node tools/verify-live.mjs && exit 0
            if [ "$try" -lt "$tries" ]; then sleep 30; fi
          done
          exit 1
