# Runs the data tests and builds the app and both Cloudflare Workers on every pull request, and on pushes that change them.
# Pull requests always run it, since "build" is their required check. Deploys stay manual.
name: checks

on:
  push:
    paths:
      - 'app/**'
      - 'app-host/**'
      - 'site/**'
      - 'tools/**'
      - '.github/workflows/checks.yml'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            app-host/package-lock.json
            site/package-lock.json
      - name: Saved data round trip (old versions load, nothing is dropped)
        run: node tools/roundtrip.mjs
      - name: Drive storage against a fake Drive
        run: node tools/drive-adapter.mjs
      - name: App build (fails on inline handlers or scripts)
        run: node tools/build-app.mjs
      - name: App host build
        working-directory: app-host
        run: npm ci && npm run build
      - name: Site build
        working-directory: site
        run: npm ci && npm run build
